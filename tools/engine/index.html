<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { createCore, addLights, lampLight, renderFinal } from './core.js';
import { makeMaterials } from './materials.js';
import { buildItems } from './models.js';

const S = window.SCENE;
const core = createCore(S, window.OUT_W || 2000);
const { scene, m } = core;
const M = makeMaterials(S);
const ctx = { ...core, M };

// floors (parquet everywhere, tiles in wet rooms), UVs in plan px so planks keep a constant width
function floor(b, mat, rep, y) {
  const w = b[2] - b[0], d = b[3] - b[1], g = new THREE.PlaneGeometry(w, d);
  const uv = g.attributes.uv.array, pos = g.attributes.position.array;
  for (let i = 0; i < pos.length / 3; i++) { const x = (b[0] + b[2]) / 2 + pos[i * 3], z = (b[1] + b[3]) / 2 - pos[i * 3 + 1]; uv[i * 2] = x / rep; uv[i * 2 + 1] = -z / rep; }
  const mesh = new THREE.Mesh(g, mat); mesh.rotation.x = -Math.PI / 2; mesh.position.set((b[0] + b[2]) / 2, y, (b[1] + b[3]) / 2); mesh.receiveShadow = true; scene.add(mesh);
}
for (const f of S.floors) floor(f.box, f.type === 'tile' ? M.tiles : M.parquet, f.type === 'tile' ? M.tilesRep : M.parquetRep, f.type === 'tile' ? 0.3 : 0);
// outside: pure white
const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
for (const r of S.outside) { const g = new THREE.Mesh(new THREE.PlaneGeometry(r[2] - r[0], r[3] - r[1]), whiteMat); g.rotation.x = -Math.PI / 2; g.position.set((r[0] + r[2]) / 2, 0.8, (r[1] + r[3]) / 2); scene.add(g); }
// walls: full height, matte black (only the top is seen, but they cast the long soft shadows)
const WH = m(S.wallHM ?? 2.7);
for (const r of S.walls) { const g = new THREE.Mesh(new THREE.BoxGeometry(r[2] - r[0], WH, r[3] - r[1]), M.wall); g.position.set((r[0] + r[2]) / 2, WH / 2, (r[1] + r[3]) / 2); g.castShadow = true; g.receiveShadow = true; scene.add(g);
  const cap = new THREE.Mesh(new THREE.PlaneGeometry(r[2] - r[0], r[3] - r[1]), M.wallCap); cap.rotation.x = -Math.PI / 2; cap.position.set((r[0] + r[2]) / 2, WH + 0.5, (r[1] + r[3]) / 2); scene.add(cap); }

buildItems(ctx, S.items, (x, z, h, p, rg) => lampLight(core, x, z, h, p, rg));
addLights(core, S);
renderFinal(core, S);
window.RENDER_DONE = true;
</script></body></html>
