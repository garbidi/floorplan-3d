<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const S = window.SCENE;              // injected JSON
const OUT_W = window.OUT_W || 3000;
const [PW, PH] = S.size;
const scale = 1;                      // 1 unit = 1 plan pixel
const WALL_H = 60;                    // wall height in plan px (only its top is seen)

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(OUT_W, OUT_H);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = null; renderer.setClearColor(0xffffff, 1);
// plan (x right, y down) -> world (x right, z down), camera looks down -y
const cam = new THREE.OrthographicCamera(0, PW, 0, -PH, 1, 2000);
cam.position.set(0, 1000, 0);
cam.up.set(0, 0, -1);
cam.lookAt(0, 0, 0);
cam.left = 0; cam.right = PW; cam.top = 0; cam.bottom = -PH;
// orthographic top-down: map world x->screen x, world z->screen y
cam.position.set(0, 1000, 0); cam.lookAt(0, 0, 0);
cam.updateProjectionMatrix();

// ---------- procedural textures ----------
function canvasTex(w, h, draw, repeat) {

  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;

}
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function wood(ctx, w, h) {
  const REF = S.style === 'ref';
  const r = rnd(7); const plankW = 64, plankL = REF ? 420 : 512;
  for (let x = 0; x < w; x += plankW) {
    let y = -Math.floor(r() * plankL);

}

  for (let i = 0; i < 2500; i++) { ctx.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '120,100,80'},${r() * 0.05})`; const s = r() * 30; ctx.fillRect(r() * w, r() * h, s, s * 0.6); }
  for (let i = 0; i < 20; i++) { ctx.strokeStyle = `rgba(140,120,100,${0.08 + r() * 0.1})`; ctx.lineWidth = 0.8; ctx.beginPath(); let x = r() * w, y = r() * h; ctx.moveTo(x, y); for (let k = 0; k < 6; k++) { x += r() * 80 - 40; y += r() * 80 - 40; ctx.lineTo(x, y); } ctx.stroke(); }
  if (tile) { ctx.strokeStyle = 'rgba(120,105,90,0.45)'; ctx.lineWidth = 1.5; for (let x = 0; x <= w; x += tile) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); } for (let y = 0; y <= h; y += tile) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); } }
}
function fabric(ctx, w, h, col, rib) {
  const r = rnd(3); ctx.fillStyle = col; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { ctx.fillStyle = `rgba(${r() < .5 ? '255,255,255' : '0,0,0'},${r() * 0.06})`; ctx.fillRect(r() * w, r() * h, 1.5, 1.5); }
  if (rib) { ctx.strokeStyle = 'rgba(0,0,0,0.07)'; for (let x = 0; x < w; x += rib) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); } }
}
const TEX = {
  wood: canvasTex(1024, 1024, wood),
  tile: canvasTex(512, 512, (c, w, h) => stone(c, w, h, 256, S.style === 'ref' ? '#e2cdbd' : '#d9c9b4')),
  stone: canvasTex(512, 512, (c, w, h) => stone(c, w, h, 0, '#cfc6bb')),
  darkstone: canvasTex(512, 512, (c, w, h) => stone(c, w, h, 0, '#3a3634')),
  boucle: canvasTex(256, 256, (c, w, h) => fabric(c, w, h, '#d8cfc2')),
  sofa: canvasTex(256, 256, (c, w, h) => fabric(c, w, h, '#9d8f84')),
  rug: canvasTex(256, 256, (c, w, h) => fabric(c, w, h, '#8f8a84', 4)),
  linen: canvasTex(256, 256, (c, w, h) => fabric(c, w, h, '#e9e2d8')),
  walnut: canvasTex(512, 512, (c, w, h) => { c.fillStyle = '#8a6352'; c.fillRect(0, 0, w, h); const r = rnd(5); for (let i = 0; i < 160; i++) { c.strokeStyle = `rgba(40,20,10,${r() * 0.12})`; c.beginPath(); const y = r() * h; c.moveTo(0, y); c.bezierCurveTo(w * 0.3, y + r() * 10 - 5, w * 0.7, y + r() * 10 - 5, w, y + r() * 6 - 3); c.stroke(); } }),

const M = {
  wall: new THREE.MeshStandardMaterial({ color: 0x0b0b0b, roughness: 1 }),
  white: new THREE.MeshStandardMaterial({ color: 0xf4f2ee, roughness: 0.35 }),
  ceramic: new THREE.MeshPhysicalMaterial({ color: 0xf7f6f3, roughness: 0.15, clearcoat: 0.6 }),
  chrome: new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 1, roughness: 0.2 }),
  black: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.3, metalness: 0.2 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xdfeef0, transmission: 0.6, opacity: 0.35, transparent: true, roughness: 0.05 }),
  walnut: new THREE.MeshStandardMaterial({ map: TEX.walnut, roughness: 0.6 }),
  oak: new THREE.MeshStandardMaterial({ map: TEX.wood, color: 0xb89a88, roughness: 0.5 }),
  stone: new THREE.MeshStandardMaterial({ map: TEX.stone, roughness: 0.4 }),
  darkstone: new THREE.MeshStandardMaterial({ map: TEX.darkstone, roughness: 0.35 }),
  boucle: new THREE.MeshStandardMaterial({ map: TEX.boucle, roughness: 1 }),
  sofa: new THREE.MeshStandardMaterial({ map: TEX.sofa, roughness: 1 }),
  rug: new THREE.MeshStandardMaterial({ map: TEX.rug, roughness: 1 }),
  linen: new THREE.MeshStandardMaterial({ map: TEX.linen, roughness: 1 }),
  steel: new THREE.MeshStandardMaterial({ color: 0xbfbfbc, metalness: 0.6, roughness: 0.35 }),
  leaf: new THREE.MeshStandardMaterial({ color: 0x4f6b3a, roughness: 0.8 }),
  pot: new THREE.MeshStandardMaterial({ color: 0xcfc4b6, roughness: 0.9 }),
  shade: new THREE.MeshStandardMaterial({ color: 0xfff1d6, emissive: 0xffc27a, emissiveIntensity: 0.9, roughness: 1 }),
  tv: new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: 0.15, metalness: 0.3 }),
};

// helpers: box in plan px [x0,y0,x1,y1], height range [z0,z1] (up)
function boxMesh(b, z0, z1, mat, rounded = 0) {
  const w = b[2] - b[0], d = b[3] - b[1], h = z1 - z0;
  const geo = rounded ? new RoundedBoxGeometry(w, h, d, 3, Math.min(rounded, w / 2 - 0.1, d / 2 - 0.1, h / 2 - 0.1)) : new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(geo, mat); m.position.set((b[0] + b[2]) / 2, z0 + h / 2, (b[1] + b[3]) / 2);
  m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
function cyl(cx, cz, r, z0, z1, mat, seg = 40) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, z1 - z0, seg), mat);
  m.position.set(cx, (z0 + z1) / 2, cz); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
function lampLight(x, z, y, intensity = 1.0, dist = 700) {
  const l = new THREE.PointLight(S.style === 'ref' ? 0xffcf96 : 0xffb96b, intensity * (S.style === 'ref' ? 35000 : 60000), dist, 2);
  l.position.set(x, y, z); l.castShadow = true; l.shadow.mapSize.set(1024, 1024); l.shadow.radius = 8; l.shadow.bias = -0.002; l.shadow.normalBias = 1.5;
  scene.add(l);
}
const inset = (b, k) => [b[0] + k, b[1] + k, b[2] - k, b[3] - k];
const W = b => b[2] - b[0], D = b => b[3] - b[1];

// ---------- floor ----------
const ex = S.extent;
const woodMat = new THREE.MeshStandardMaterial({ map: TEX.wood, roughness: 0.6 });
const tileMat = new THREE.MeshStandardMaterial({ map: TEX.tile, roughness: 0.45 });
for (const f of S.floors) {
  const b = f.box, isTile = f.type === 'tile';
  const geo = new THREE.PlaneGeometry(W(b), D(b));
  const rep = S.style === 'ref' ? (isTile ? 100 : 230) : (isTile ? 180 : 420), uv = geo.attributes.uv.array, pos = geo.attributes.position.array;
  for (let i = 0; i < pos.length / 3; i++) { const x = (b[0] + b[2]) / 2 + pos[i * 3], z = (b[1] + b[3]) / 2 - pos[i * 3 + 1]; uv[i * 2] = x / rep; uv[i * 2 + 1] = -z / rep; }
  const m = new THREE.Mesh(geo, isTile ? tileMat : woodMat);
  m.rotation.x = -Math.PI / 2; m.position.set((b[0] + b[2]) / 2, isTile ? 0.3 : 0, (b[1] + b[3]) / 2); m.receiveShadow = true; scene.add(m);
}
// ---------- outside the apartment: pure white cover ----------
const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff, toneMapped: false });
for (const r of S.outside) { const m = new THREE.Mesh(new THREE.PlaneGeometry(W(r), D(r)), whiteMat); m.rotation.x = -Math.PI / 2; m.position.set((r[0] + r[2]) / 2, 0.8, (r[1] + r[3]) / 2); scene.add(m); }
// ---------- walls ----------
for (const r of S.walls) boxMesh(r, 0, WALL_H, M.wall);

// ---------- items ----------
const H = { sofa: 22, bed: 20 };
for (const it of S.items) {
  const b = it.box, t = it.type;
  if (t === 'shaft') boxMesh(b, 0, WALL_H, M.wall);
  else if (t === 'counter') { boxMesh(b, 0, 34, M.walnut); boxMesh(inset(b, -1), 34, 37, M[it.top || 'darkstone']); }
  else if (t === 'sink') { boxMesh(inset(b, 6), 30, 37.5, M.steel, 3); boxMesh(inset(b, 11), 30.5, 37.6, new THREE.MeshStandardMaterial({ color: 0x8e8e8a, metalness: .7, roughness: .3 }), 2); cyl(b[0] + W(b) * 0.2, (b[1] + b[3]) / 2, 2.5, 37, 52, M.chrome, 16); }
  else if (t === 'cooktop') { boxMesh(inset(b, 4), 37, 38.2, M.black, 2); const n = it.zones || 2; if (n === 4) { const r = Math.min(W(b), D(b)) * 0.19; for (const [fx, fz] of [[.28, .28], [.72, .28], [.28, .72], [.72, .72]]) { const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.85, r, 48), new THREE.MeshBasicMaterial({ color: 0x555555 })); ring.rotation.x = -Math.PI / 2; ring.position.set(b[0] + W(b) * fx, 38.3, b[1] + D(b) * fz); scene.add(ring); } } else for (let i = 0; i < n; i++) { const r = Math.min(W(b), D(b)) * 0.22; const ring = new THREE.Mesh(new THREE.RingGeometry(r * 0.85, r, 48), new THREE.MeshBasicMaterial({ color: 0x555555 })); ring.rotation.x = -Math.PI / 2; const along = W(b) > D(b); ring.position.set(along ? b[0] + W(b) * (i + .5) / n : (b[0] + b[2]) / 2, 38.3, along ? (b[1] + b[3]) / 2 : b[1] + D(b) * (i + .5) / n); scene.add(ring); } }
  else if (t === 'fridge') boxMesh(inset(b, 1), 0, 80, new THREE.MeshStandardMaterial({ color: 0xcfcfcd, metalness: 0.4, roughness: 0.35 }), 3);
  else if (t === 'sofa') {
    const along = W(b) > D(b), side = it.backSide || (along ? 'top' : 'left');
    const depth = along ? D(b) : W(b), bk = it.back || depth * 0.25, arm = it.arm || (along ? W(b) * 0.07 : D(b) * 0.07);
    boxMesh(b, 0, 12, M.sofa, 4);
    const bb = side === 'top' ? [b[0], b[1], b[2], b[1] + bk] : side === 'bottom' ? [b[0], b[3] - bk, b[2], b[3]] : side === 'left' ? [b[0], b[1], b[0] + bk, b[3]] : [b[2] - bk, b[1], b[2], b[3]];
    boxMesh(bb, 12, 30, M.sofa, 5);
    if (along) { boxMesh([b[0], b[1], b[0] + arm, b[3]], 12, 24, M.sofa, 4); boxMesh([b[2] - arm, b[1], b[2], b[3]], 12, 24, M.sofa, 4); }
    else { boxMesh([b[0], b[1], b[2], b[1] + arm], 12, 24, M.sofa, 4); boxMesh([b[0], b[3] - arm, b[2], b[3]], 12, 24, M.sofa, 4); }
    const n = it.seats || 2;
    for (let i = 0; i < n; i++) {
      let sb;
      if (along) { const x0 = b[0] + arm + (W(b) - 2 * arm) * i / n + 1, x1 = b[0] + arm + (W(b) - 2 * arm) * (i + 1) / n - 1; sb = side === 'bottom' ? [x0, b[1] + 2, x1, b[3] - bk] : [x0, b[1] + bk, x1, b[3] - 2]; }
      else { const z0 = b[1] + arm + (D(b) - 2 * arm) * i / n + 1, z1 = b[1] + arm + (D(b) - 2 * arm) * (i + 1) / n - 1; sb = side === 'right' ? [b[0] + 2, z0, b[2] - bk, z1] : [b[0] + bk, z0, b[2] - 2, z1]; }
      boxMesh(sb, 12, 18, M.sofa, 5);
    }
    const cush = it.cushions || [];
    for (const c of cush) { const cb = c.box; const m = boxMesh(cb, 18, 33, new THREE.MeshStandardMaterial({ map: TEX.boucle, color: c.color || 0xffffff, roughness: 1 }), 4); m.rotation.y = (c.rot || 0) * Math.PI / 180; }
  }
  else if (t === 'towelrail') { boxMesh(b, 0, 40, M.white, 1); for (let k = 1; k < 6; k++) boxMesh([b[0], b[1] + D(b) * k / 6 - 1, b[2], b[1] + D(b) * k / 6 + 1], 40, 42, M.chrome); }
  else if (t === 'rug') { const m = boxMesh(b, 0.5, 1.8, M.rug, 1); }
  else if (t === 'table') { boxMesh(b, 30, 33, M.walnut, 1.5); const L = 2; for (const [x, z] of [[b[0] + 4, b[1] + 4], [b[2] - 4, b[1] + 4], [b[0] + 4, b[3] - 4], [b[2] - 4, b[3] - 4]]) cyl(x, z, L, 0, 30, M.walnut, 8); for (const p of it.plates || []) { cyl(p[0], p[1], 7, 33, 34, M.ceramic); } }
  else if (t === 'chair') { const cm = S.style === 'ref' ? new THREE.MeshStandardMaterial({ map: TEX.boucle, color: 0xa39893, roughness: 1 }) : M.boucle; boxMesh(b, 16, 19, cm, 3); const back = it.back || 'left'; const bb = back === 'left' ? [b[0], b[1], b[0] + W(b) * .22, b[3]] : back === 'right' ? [b[2] - W(b) * .22, b[1], b[2], b[3]] : back === 'top' ? [b[0], b[1], b[2], b[1] + D(b) * .22] : [b[0], b[3] - D(b) * .22, b[2], b[3]]; boxMesh(bb, 19, 32, cm, 3); }
  else if (t === 'console') { boxMesh(b, 0, 18, M.walnut, 1.5); }
  else if (t === 'tv') { boxMesh(b, 18, 21, M.tv, 0.5); }
  else if (t === 'toilet') { const m = new THREE.Mesh(new THREE.CapsuleGeometry(Math.min(W(b), D(b)) * 0.45, Math.max(W(b), D(b)) * 0.35, 8, 24), M.ceramic); m.rotation.z = Math.PI / 2; if (D(b) > W(b)) m.rotation.set(Math.PI / 2, 0, 0); m.scale.set(1, 1, 0.45); m.position.set((b[0] + b[2]) / 2, 14, (b[1] + b[3]) / 2); m.castShadow = true; scene.add(m); }
  else if (t === 'ledge') { boxMesh(b, 0, 38, M.white, 1); for (const [fx, c] of [[0.2, 0x8a7d70], [0.35, 0xe8e2da], [0.5, 0x5b6b5a]]) cyl(b[0] + W(b) * fx, (b[1] + b[3]) / 2, Math.min(W(b), D(b)) * 0.18, 38, 50, new THREE.MeshStandardMaterial({ color: c, roughness: 0.5 }), 16); }
  else if (t === 'vanity') { boxMesh(b, 0, 30, M.walnut, 1); const bb = inset(b, 3); const bowl = new THREE.Mesh(new THREE.CapsuleGeometry(Math.min(W(bb), D(bb)) * 0.45, Math.max(W(bb), D(bb)) * 0.3, 6, 24), M.ceramic); bowl.scale.set(1, 1, 0.35); if (D(bb) > W(bb)) bowl.rotation.x = Math.PI / 2; else bowl.rotation.z = Math.PI / 2; bowl.position.set((b[0] + b[2]) / 2, 32, (b[1] + b[3]) / 2); scene.add(bowl); }
  else if (t === 'washer') { boxMesh(b, 0, 55, M.white, 3); boxMesh([b[0] + 3, b[1] + 2, b[2] - 3, b[1] + D(b) * 0.2], 55, 55.6, new THREE.MeshStandardMaterial({ color: 0xd8d8d8 }), 1); }
  else if (t === 'shower') {
    // pentagonal tray: rectangle with the bottom-right corner cut at 45°
    const w = W(b), d = D(b), cx = it.cutX, cz = it.cutZ;           // cut points in plan px
    const tl = it.corner === 'tl', tr = it.corner === 'tr';           // which corner is cut (default bottom-right)
    const pts = tr ? [[b[0], b[1]], [cx, b[1]], [b[2], cz], [b[2], b[3]], [b[0], b[3]]] : tl ? [[cx, b[1]], [b[2], b[1]], [b[2], b[3]], [b[0], b[3]], [b[0], cz]] : [[b[0], b[1]], [b[2], b[1]], [b[2], cz], [cx, b[3]], [b[0], b[3]]];
    const sh = new THREE.Shape(); sh.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) sh.lineTo(p[0], p[1]); sh.lineTo(pts[0][0], pts[0][1]);
    const tray = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, { depth: 4, bevelEnabled: true, bevelSize: 1.5, bevelThickness: 1, bevelSegments: 2 }), new THREE.MeshPhysicalMaterial({ color: 0xf2f0ec, roughness: 0.25, clearcoat: 0.4 }));
    tray.rotation.x = Math.PI / 2; tray.position.y = 4; tray.receiveShadow = true; scene.add(tray);
    // drain
    cyl(tl ? b[2] - w * 0.35 : b[0] + w * 0.35, tl || tr ? b[3] - d * 0.3 : b[1] + d * 0.3, 6, 4.5, 5.2, M.chrome, 24);
    // frameless glass along the open sides: right edge, 45° cut, bottom edge
    const gm = new THREE.MeshPhysicalMaterial({ color: 0xe6f2f4, transparent: true, opacity: 0.55, roughness: 0.05, metalness: 0.1 });
    const seg = (x0, z0, x1, z1) => { const L = Math.hypot(x1 - x0, z1 - z0); const m = new THREE.Mesh(new THREE.BoxGeometry(L, 60, 2.5), gm); m.position.set((x0 + x1) / 2, 34, (z0 + z1) / 2); m.rotation.y = -Math.atan2(z1 - z0, x1 - x0); scene.add(m);
      const edge = new THREE.Mesh(new THREE.BoxGeometry(L, 1.2, 3.2), M.chrome); edge.position.set((x0 + x1) / 2, 64.5, (z0 + z1) / 2); edge.rotation.y = m.rotation.y; scene.add(edge); };
    if (tr) { seg(b[0], b[1], cx, b[1]); seg(cx, b[1], b[2], cz); seg(b[2], cz, b[2], b[3]); }
    else if (tl) { seg(b[0], b[3], b[0], cz); seg(b[0], cz, cx, b[1]); seg(cx, b[1], b[2], b[1]); }
    else { seg(b[2], b[1], b[2], cz); seg(b[2], cz, cx, b[3]); seg(cx, b[3], b[0], b[3]); }
    // rain shower head on the top wall
    if (tr) cyl(b[0] + w * 0.12, b[1] + d * 0.6, 10, 62, 63.5, M.chrome, 32); else if (tl) cyl(b[2] - w * 0.12, b[3] - d * 0.4, 10, 62, 63.5, M.chrome, 32); else cyl(b[0] + w * 0.35, b[1] + d * 0.12, 10, 62, 63.5, M.chrome, 32);
  }
  else if (t === 'closet') {
    // built-in wardrobe: walnut carcass (back panel, end panels, top frame, plinth) + rail + garments + LED
    const along = it.along !== undefined ? it.along : W(b) > D(b), th = 7, H = 72;
    const car = new THREE.MeshStandardMaterial({ map: TEX.walnut, color: 0xe6d6c4, roughness: 0.55 });
    const inner = new THREE.MeshStandardMaterial({ map: TEX.walnut, color: 0x9c8574, roughness: 0.7 });
